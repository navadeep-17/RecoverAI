version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: recoverai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: recoverai
      POSTGRES_PASSWORD: recoverai_secret
      POSTGRES_DB: recoverai
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U recoverai -d recoverai']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
    driver: local
