name: RecoverAI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint, Typecheck, Test, and Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: recoverai
          POSTGRES_PASSWORD: recoverai_secret
          POSTGRES_DB: recoverai
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://recoverai:recoverai_secret@127.0.0.1:5432/recoverai?schema=public"
      PG_BOSS_SCHEMA: "pgboss"
      NODE_ENV: "test"
      SESSION_SECRET: "ci_testing_session_secret_32_chars_long"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run --workspace=@recoverai/db db:generate

      - name: Build Packages (Declarations)
        run: npm run build:packages

      - name: Lint
        run: npm run lint

      - name: Typecheck Workspaces
        run: npm run typecheck

      - name: Apply Database Migrations (Clean PostgreSQL Migration Gate)
        run: npx prisma migrate deploy --schema=packages/db/prisma/schema.prisma

      - name: Run Unit and Integration Tests
        run: npm run test

      - name: Build All Workspaces
        run: npm run build
